[package]
name = "ai-quota-bar"
version = "0.3.0"
description = "在 Windows 工作列時鐘旁顯示 AI 訂閱額度（Claude、Codex、Copilot、Antigravity）"
license = "MIT"
edition = "2021"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
